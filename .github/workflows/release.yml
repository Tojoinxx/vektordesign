# Windows-Installer bauen und als GitHub-Release veröffentlichen – auf zwei Wegen:
#   1. Versions-Tag pushen:  git tag v0.2.0 && git push origin v0.2.0
#   2. Ohne Git, auch vom Handy: Actions → Release → „Run workflow“ → Version eingeben
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. 0.2.0 (nur Zahlen)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows-Installer veröffentlichen
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Version übernehmen
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag="v${INPUT_VERSION#v}"; else tag="$REF_NAME"; fi
          node scripts/set-version.mjs "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Unit-Tests
        run: npm test

      - name: Installer bauen (NSIS-Setup und MSI)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: .github/scripts/run-annotated.sh "Desktop-Build fehlgeschlagen" npx tauri build

      - name: Einzeldatei bauen (ohne Installation)
        run: npm run build:single

      - name: Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          files=(src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi dist-single/Vektordesign.html)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release schon vorhanden (z. B. auf github.com angelegt): Dateien anhängen bzw. ersetzen
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Vektordesign $TAG" --notes-file .github/release-notes.md "${files[@]}"
          fi
