# Versions-Tag (z. B. v0.2.0) → Windows-Installer bauen und als GitHub-Release veröffentlichen.
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows-Installer veröffentlichen
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Version aus dem Tag übernehmen
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/set-version.mjs "$TAG"

      - name: Unit-Tests
        run: npm test

      - name: Installer bauen (NSIS-Setup und MSI)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: .github/scripts/run-annotated.sh "Desktop-Build fehlgeschlagen" npx tauri build

      - name: Einzeldatei bauen (ohne Installation)
        run: npm run build:single

      - name: Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "Vektordesign $TAG" \
            --notes-file .github/release-notes.md \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            dist-single/Vektordesign.html
