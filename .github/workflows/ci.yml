# Bei jedem Push und Pull Request: prüfen, testen, Windows-Installer bauen.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Prüfen und testen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Unit-Tests (Solver, Bemaßungen, Export, Claude-Werkzeuge)
        run: npm test

      - name: Web-Version bauen
        run: npm run build

      - name: End-to-End-Test im Browser (inkl. Abnahme Meilenstein 1)
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Einzeldatei bauen (läuft ohne Installation im Browser)
        run: npm run build:single

      - name: Einzeldatei hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Vektordesign-Einzeldatei
          path: dist-single/Vektordesign.html
          if-no-files-found: error
          retention-days: 14

      - name: Screenshots der Browser-Tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: tests/e2e/output/*.png
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows-Installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Abhängigkeiten installieren
        run: npm ci

      # Mit dem Feature „selftest“, damit das fertige Programm unten im echten Fenster geprüft werden kann.
      # Veröffentlichte Installer (release.yml) werden ohne dieses Feature gebaut.
      - name: Installer bauen (NSIS-Setup und MSI)
        run: npx tauri build --features selftest

      - name: Installer hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Vektordesign-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Selbsttest im echten Fenster (WebView2)
        timeout-minutes: 5
        run: node tests/desktop/run-desktop-test.mjs --binary src-tauri/target/release/vektordesign.exe
