[package]
name = "vektordesign"
version = "0.1.0"
description = "Maßgenaues 2D-Vektorgrafikprogramm für Textil-Designs"
authors = ["Tony Lam"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vektordesign_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Selbsttest im echten Fenster auch in Release-Builds ermöglichen (nur für CI, siehe tests/desktop)
selftest = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.23"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
